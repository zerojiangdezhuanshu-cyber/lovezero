name: VPN Gate Node Check

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check configuration
        run: |
          python --version
          test -f vpngate.py
          test -f requirements.txt
          echo "Python files verified."

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python -u vpngate.py
        env:
          CHECK_WORKER: "https://check.helei.kdns.fr/check?sstp=vpn:vpn@"
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"
          PYTHONUNBUFFERED: "1"

      - name: Verify generated site
        run: |
          if [ ! -d public ]; then
            echo "::error::public directory was not generated."
            exit 1
          fi

          if [ -z "$(find public -type f -print -quit)" ]; then
            echo "::error::public directory contains no files."
            exit 1
          fi

          echo "Generated site files:"
          find public -maxdepth 2 -type f

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: |
          echo "Site URL: ${{ steps.deployment.outputs.page_url }}"
